```html
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hotline Miami Loader</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family: Consolas, monospace;
    }

    body{
        overflow:hidden;
        background:black;
        color:white;
    }

    /* Радужный фон */
    .bg{
        position:fixed;
        width:100%;
        height:100%;
        background:
            linear-gradient(
                45deg,
                #ff0080,
                #ff8c00,
                #40e0d0,
                #8a2be2,
                #ff0080
            );
        background-size:400% 400%;
        animation: neonFlow 10s ease infinite;
        filter: blur(20px) brightness(0.7);
        transform: scale(1.2);
        z-index:-2;
    }

    .overlay{
        position:fixed;
        width:100%;
        height:100%;
        background:rgba(0,0,0,0.35);
        z-index:-1;
    }

    @keyframes neonFlow{
        0%{background-position:0% 50%;}
        50%{background-position:100% 50%;}
        100%{background-position:0% 50%;}
    }

    .console{
        position:absolute;
        top:50%;
        left:50%;
        transform:translate(-50%, -50%);
        width:80%;
        max-width:800px;
        height:400px;
        background:rgba(0,0,0,0.65);
        border:2px solid #ff00aa;
        box-shadow:0 0 30px #ff00aa;
        padding:20px;
        overflow:hidden;
    }

    .title{
        color:#00ffee;
        margin-bottom:20px;
        font-size:24px;
        text-shadow:0 0 10px #00ffee;
    }

    .log{
        height:280px;
        overflow:hidden;
        line-height:1.6;
        font-size:18px;
    }

    .line{
        animation: appear 0.15s linear;
    }

    @keyframes appear{
        from{
            opacity:0;
            transform:translateX(-10px);
        }
        to{
            opacity:1;
            transform:translateX(0);
        }
    }

    .progress-container{
        margin-top:20px;
        width:100%;
        height:25px;
        background:#111;
        border:1px solid #ff00aa;
    }

    .progress{
        width:0%;
        height:100%;
        background:linear-gradient(90deg,#ff0080,#00ffee);
        box-shadow:0 0 20px #ff00aa;
        transition:width 0.1s linear;
    }

    .final-screen{
        position:fixed;
        inset:0;
        background:white;
        display:flex;
        align-items:center;
        justify-content:center;
        font-size:80px;
        color:black;
        opacity:0;
        pointer-events:none;
        transition:0.5s;
    }

    .final-screen.show{
        opacity:1;
    }
</style>
</head>
<body>

<div class="bg"></div>
<div class="overlay"></div>

<div class="console">
    <div class="title">
        > Загрузка Птичек-Пиздушек...
    </div>

    <div class="log" id="log"></div>

    <div class="progress-container">
        <div class="progress" id="progress"></div>
    </div>
</div>

<div class="final-screen" id="final">
    100%
</div>

<script>
    const log = document.getElementById("log");
    const progress = document.getElementById("progress");
    const final = document.getElementById("final");

    let percent = 0;

    const messages = [
        "Поиск птичек...",
        "Распаковка крыльев...",
        "Загрузка перьев...",
        "Калибровка писка...",
        "Сканирование голубей...",
        "Проверка чаек...",
        "Подключение уток...",
        "Разгон воробьёв...",
        "Запуск чайки.exe...",
        "Компиляция криков..."
    ];

    function addLine(text){
        const div = document.createElement("div");
        div.className = "line";
        div.textContent = text;
        log.appendChild(div);

        log.scrollTop = log.scrollHeight;
    }

    const interval = setInterval(() => {

        percent++;

        const randomMsg =
            messages[Math.floor(Math.random() * messages.length)];

        addLine(
            "[" + percent + "%] " + randomMsg
        );

        progress.style.width = percent + "%";

        if(percent >= 100){
            clearInterval(interval);

            setTimeout(() => {
                document.querySelector(".console").style.display = "none";
                final.classList.add("show");
            }, 500);
        }

    }, 80);
</script>

</body>
</html>
