<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MLG 2015</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: "Comic Sans MS", cursive, sans-serif;
      background: linear-gradient(45deg, red, orange, yellow, green, cyan, blue, violet);
      background-size: 400% 400%;
      animation: rainbow 5s infinite linear;
      overflow: hidden;
    }

    @keyframes rainbow {
      0% { background-position: 0% 50%; }
      100% { background-position: 100% 50%; }
    }

    h1 {
      font-size: 60px;
      text-align: center;
      color: white;
      text-shadow: 0 0 10px black, 0 0 20px red, 0 0 30px blue;
      animation: shake 0.3s infinite;
    }

    @keyframes shake {
      0% { transform: translate(0px, 0px) rotate(0deg); }
      25% { transform: translate(2px, -2px) rotate(1deg); }
      50% { transform: translate(-2px, 2px) rotate(-1deg); }
      75% { transform: translate(2px, 2px) rotate(1deg); }
      100% { transform: translate(0px, 0px) rotate(0deg); }
    }

    .glow {
      position: absolute;
      width: 200px;
      height: 200px;
      background: radial-gradient(circle, rgba(255,255,255,0.6), transparent);
      animation: float 6s infinite ease-in-out;
    }

    .glow:nth-child(1) { top: 10%; left: 20%; }
    .glow:nth-child(2) { top: 70%; left: 80%; }
    .glow:nth-child(3) { top: 50%; left: 10%; }

    @keyframes float {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-30px); }
    }
  </style>
</head>
<body>

  <div class="glow"></div>
  <div class="glow"></div>
  <div class="glow"></div>

  <h1>Я просто страдаю хуйней 😎🔥</h1>

  
  <audio autoplay loop>
    <source src="https://www.myinstants.com/media/sounds/mlg-airhorn.mp3" type="audio/mpeg">
  </audio>

  <img src="https://i.imgur.com/4AiXzf8.jpeg" class="doge" />
  <img src="https://i.imgur.com/Z6X7K0s.png" class="glasses" />

  <script>
    // random rotate spam
    setInterval(() => {
      document.body.style.transform = `rotate(${Math.random()*2-1}deg)`;
    }, 200);
  </script>

  <style>
    .doge {
      position: absolute;
      bottom: 10px;
      right: 10px;
      width: 200px;
      animation: spin 3s linear infinite;
    }

    .glasses {
      position: absolute;
      top: 20px;
      left: 20px;
      width: 150px;
      animation: bounce 1s infinite;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes bounce {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
    }
  </style>

</body>
</html>
