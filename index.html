<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skibidi Hawaii</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: "Comic Sans MS", cursive, sans-serif;
      background: linear-gradient(45deg, red, orange, yellow, green, cyan, blue, violet);
      background-size: 400% 400%;
      animation: rainbow 5s infinite linear;
      overflow: hidden;
    }

    @keyframes rainbow {
      0% { background-position: 0% 50%; }
      100% { background-position: 100% 50%; }
    }

    h1 {
      font-size: 60px;
      text-align: center;
      color: white;
      text-shadow: 0 0 10px black, 0 0 20px red, 0 0 30px blue;
      animation: shake 0.3s infinite;
    }

    @keyframes shake {
      0% { transform: translate(0px, 0px) rotate(0deg); }
      25% { transform: translate(2px, -2px) rotate(1deg); }
      50% { transform: translate(-2px, 2px) rotate(-1deg); }
      75% { transform: translate(2px, 2px) rotate(1deg); }
      100% { transform: translate(0px, 0px) rotate(0deg); }
    }

    
    }

    .glow:nth-child(1) { top: 10%; left: 20%; }
    .glow:nth-child(2) { top: 70%; left: 80%; }
    .glow:nth-child(3) { top: 50%; left: 10%; }

    @keyframes float {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-30px); }
    }
  </style>
</head>
<body>

  <div class="glow"></div>
  <div class="glow"></div>
  <div class="glow"></div>

  <h1>Skibidi Hawaii</h1>
  
</body>
</html>
